
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
      <defs>
        <style>
          .text-main { fill: #FFFFFF; font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 800; }
          .text-accent { fill: #22d3ee; font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 400; }
        </style>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>
      <g transform="translate(10, 10)">
        <circle cx="35" cy="35" r="30" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
        <circle cx="35" cy="35" r="20" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
        <circle cx="35" cy="35" r="10" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
        <path d="M35 35 L52.5 21" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
        <circle cx="52.5" cy="21" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
        <circle cx="24" cy="45" r="2" fill="#22d3ee"/>
      </g>
      <text x="110" y="72" font-size="44" class="text-main" letter-spacing="1">POWER<tspan class="text-accent" font-weight="300">RADAR</tspan></text>
    </svg>
  